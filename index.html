<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECF0F6">
<meta name="description" content="DataDev Pipe Weight Calculator — weight, wall thickness and price of PE, PP-R, PVC, UPVC, PEX, CPVC, ABS, PVDF, copper, carbon steel and stainless pipes.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DataDev Pipe">
<title>ماشین حساب وزن لوله | DataDev</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="preload" href="assets/fonts/estedad.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img class="brand-logo" src="assets/icons/icon.svg" alt="DataDev" width="50" height="50">
      <div>
        <h1 data-i18n="app.title"></h1>
        <p class="brand-sub"><span class="dd">Data<span>Dev</span></span> <span data-i18n="app.subtitle"></span></p>
      </div>
    </div>
    <label class="lang glass">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
      <select id="langSelect" aria-label="Language"></select>
    </label>
  </header>

  <main>
    <!-- Calculator -->
    <section class="view" id="view-calc" data-view="calc">
      <div class="hero glass">
        <h2 data-i18n-html="hero.title"></h2>
        <p data-i18n="hero.text"></p>
        <svg class="hero-pipe" viewBox="0 0 220 170" aria-hidden="true">
  <defs>
    <linearGradient id="pBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F8FD"/><stop offset=".18" stop-color="#D0E1F2"/>
      <stop offset=".5" stop-color="#6E9ECC"/><stop offset=".82" stop-color="#355982"/><stop offset="1" stop-color="#223A5E"/>
    </linearGradient>
    <linearGradient id="pRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F8FD"/><stop offset=".6" stop-color="#9FC0E3"/><stop offset="1" stop-color="#4D79A8"/>
    </linearGradient>
    <radialGradient id="pBore" cx=".62" cy=".42" r=".7">
      <stop offset="0" stop-color="#0c1729"/><stop offset=".65" stop-color="#14243d"/><stop offset="1" stop-color="#2b4f7a"/>
    </radialGradient>
    <linearGradient id="pWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ADFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#0AFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="pSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <ellipse cx="112" cy="150" rx="78" ry="9" fill="#8B9BB8" opacity=".45" filter="url(#pSoft)"/>
  <g transform="rotate(-16 120 90)">
    <!-- far end -->
    <ellipse cx="196" cy="88" rx="11" ry="32" fill="url(#pBody)"/>
    <!-- body -->
    <rect x="56" y="56" width="140" height="64" fill="url(#pBody)"/>
    <rect x="56" y="63" width="140" height="5" rx="2.5" fill="#fff" opacity=".55"/>
    
    <!-- coupling band -->
    <rect x="150" y="54" width="14" height="68" rx="3" fill="url(#pBody)"/>
    <rect x="150" y="54" width="14" height="68" rx="3" fill="#0c1729" opacity=".12"/>
    <rect x="152" y="60" width="3" height="56" rx="1.5" fill="#fff" opacity=".45"/>
    <!-- open end: rim shows the wall thickness -->
    <ellipse cx="56" cy="88" rx="12" ry="32" fill="url(#pRim)"/>
    <ellipse cx="57.5" cy="88" rx="8.4" ry="24" fill="url(#pBore)"/>
    <path d="M51 70 a8.4 24 0 0 1 9 -6" stroke="#fff" stroke-width="1.6" fill="none" opacity=".7" stroke-linecap="round"/>
    <!-- water flowing out -->
    <path d="M54 104 C 46 116, 40 128, 42 148 L 54 148 C 52 132, 56 120, 60 108 Z" fill="url(#pWater)" opacity=".85"/>
    <circle class="drop d1" cx="46" cy="152" r="2.6" fill="#ADFFFF"/>
    <circle class="drop d2" cx="53" cy="158" r="1.8" fill="#0AFFFF"/>
    <!-- diameter callout -->
    <g stroke="#1F5FC8" stroke-width="1.2" opacity=".75" fill="none">
      <path d="M32 56 V120"/><path d="M29 59 l3 -4 3 4 M29 117 l3 4 3 -4"/>
      <path d="M34 56 H48 M34 120 H48" stroke-dasharray="2 2"/>
    </g>
    <text x="16" y="92" fill="#1F5FC8" font-size="13" font-family="'Space Grotesk', sans-serif" font-weight="700">Ø</text>
  </g>
</svg>
      </div>

      <div class="sec"><h3 data-i18n="sec.type"></h3></div>
      <div class="chips" id="familyChips" role="tablist"></div>

      <div class="sec"><h3 data-i18n="sec.calc"></h3><span class="sec-meta" id="calcMeta"></span></div>
      <form class="card glass" id="calcForm" novalidate>
        <div class="seg" id="standardSeg" role="radiogroup"></div>
        <p class="std-label" id="standardLabel"></p>

        <div class="grid">
          <div class="field full" id="gradeField" hidden>
            <label for="grade" data-i18n="f.grade"></label>
            <select id="grade"></select>
          </div>
          <div class="field" data-std>
            <label for="size" data-i18n="f.size"></label>
            <select id="size"></select>
          </div>
          <div class="field" data-std>
            <label for="pipeClass" data-i18n="f.class"></label>
            <select id="pipeClass"></select>
          </div>
          <div class="field full" data-custom hidden>
            <label for="material" data-i18n="f.material"></label>
            <select id="material"></select>
          </div>
          <div class="field" data-custom hidden>
            <label for="od" data-i18n="f.od"></label>
            <input id="od" inputmode="decimal" autocomplete="off" placeholder="110">
          </div>
          <div class="field" data-custom hidden>
            <label for="wall" data-i18n="f.wall"></label>
            <input id="wall" inputmode="decimal" autocomplete="off" placeholder="6.6">
          </div>
          <div class="field">
            <label for="price"><span data-i18n="f.price"></span> <small class="opt" data-i18n="f.optional"></small></label>
            <input id="price" inputmode="decimal" autocomplete="off">
          </div>
          <div class="field">
            <label for="length" data-i18n="f.length"></label>
            <input id="length" inputmode="decimal" autocomplete="off" value="1">
          </div>
        </div>

        <button class="btn" type="submit">
          <span data-i18n="btn.calc"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <div class="res glass" id="result" aria-live="polite">
        <div class="stats">
          <div class="st"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg><b id="rClass">—</b><small data-i18n="r.class"></small></div>
          <div class="st"><svg viewBox="0 0 24 24"><path d="M4 12h16M7 8l-3 4 3 4M17 8l3 4-3 4"/></svg><b id="rWall">—</b><small data-i18n="r.wall"></small></div>
          <div class="st"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8 12h8"/></svg><b id="rId">—</b><small data-i18n="r.id"></small></div>
          <div class="st"><svg viewBox="0 0 24 24"><path d="M6 20h12l-2-12H8z"/><circle cx="12" cy="5" r="2"/></svg><b id="rKgm">—</b><small data-i18n="r.wm"></small></div>
        </div>
        <div class="rows">
          <div class="row"><span data-i18n="r.wt"></span><b id="rWeight">—</b></div>
          <div class="row"><span data-i18n="r.pm"></span><b id="rPm">—</b></div>
        </div>
        <div class="tot"><small data-i18n="r.total"></small><b id="rTotal">—</b></div>
      </div>

      <div class="sec"><h3><span data-i18n="sec.table"></span> <span id="previewTitle"></span></h3><button class="link" type="button" data-go="tables" data-i18n="link.tables"></button></div>
      <div class="table-wrap glass" id="preview"></div>
    </section>

    <!-- Tables -->
    <section class="view" id="view-tables" data-view="tables" hidden>
      <div class="sec"><h3 data-i18n="nav.tables"></h3><span class="sec-meta" data-i18n="t.cell"></span></div>
      <div class="card glass compact">
        <div class="grid">
          <div class="field full"><label for="tFamily" data-i18n="sec.type"></label><select id="tFamily"></select></div>
          <div class="field full"><label for="tStandard" data-i18n="f.standard"></label><select id="tStandard"></select></div>
        </div>
      </div>
      <div class="table-wrap glass" id="fullTable"></div>
    </section>

    <!-- Compare -->
    <section class="view" id="view-compare" data-view="compare" hidden>
      <div class="sec"><h3 data-i18n="c.title"></h3><span class="sec-meta" id="compareMeta"></span></div>
      <p class="hint" data-i18n="c.hint"></p>
      <div class="table-wrap glass" id="compareTable"></div>
    </section>

    <!-- Settings -->
    <section class="view" id="view-settings" data-view="settings" hidden>
      <div class="sec"><h3 data-i18n="nav.settings"></h3></div>
      <div class="card glass">
        <div class="grid">
          <div class="field full"><label for="setLang" data-i18n="s.language"></label><select id="setLang"></select></div>
        </div>
      </div>
      <div class="sec"><h3 data-i18n="s.about"></h3></div>
      <div class="card glass"><p class="about" data-i18n="s.method"></p><ul class="sources" id="sources"></ul></div>
    </section>

    <footer class="foot">
      <span data-i18n="footer.dev"></span>: <b data-i18n="dev.name"></b>
      <a class="dd-badge glass" href="https://datadevvv.ir" target="_blank" rel="noopener" aria-label="DataDev — datadevvv.ir">
        <img src="assets/icons/icon.svg" alt="" width="26" height="26"><b>DataDev</b> <small>datadevvv.ir</small>
      </a>
    </footer>
  </main>

  <nav class="nav glass" aria-label="Main">
    <button type="button" data-go="calc" class="on"><span class="i"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg></span><span data-i18n="nav.calc"></span></button>
    <button type="button" data-go="tables"><span class="i"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg></span><span data-i18n="nav.tables"></span></button>
    <button type="button" data-go="compare"><span class="i"><svg viewBox="0 0 24 24"><path d="M4 18V9M10 18V5M16 18v-7M22 18H2"/></svg></span><span data-i18n="nav.compare"></span></button>
    <button type="button" data-go="settings"><span class="i"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg></span><span data-i18n="nav.settings"></span></button>
  </nav>
</div>
</body>
</html>
